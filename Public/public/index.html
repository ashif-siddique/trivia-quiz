```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Multiplayer Trivia Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f4f4f9;

            margin: 0;

            padding: 20px;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .container {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);

            width: 100%;

            max-width: 520px;

            text-align: center;
        }

        input,
        button {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        button {

            background: #007bff;

            color: white;

            border: none;

            cursor: pointer;
        }

        button:hover {

            background: #0056b3;
        }

        button:disabled {

            background: #999;

            cursor: not-allowed;
        }

        .hidden {

            display: none;
        }

        .room-info {

            background: #eef5ff;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 15px;
        }

        #players-list,
        #score-list {

            list-style: none;

            padding: 0;
        }

        #players-list li,
        #score-list li,
        .leader {

            background: #f1f1f1;

            padding: 10px;

            border-radius: 6px;

            margin: 6px 0;
        }

        .option {

            margin-top: 10px;
        }

        #message,
        #login-message {

            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;
        }

        hr {

            margin: 22px 0;

            border: 0;

            border-top: 1px solid #ddd;
        }

        .status {

            font-size: 14px;

            color: #666;

            margin-top: 10px;
        }

    </style>

</head>

<body>


<!-- =========================
     LOGIN SCREEN
========================= -->

<div
    class="container"
    id="login-screen"
>

    <h2>🎯 Trivia Quiz Room</h2>

    <p>
        Naam aur room code enter karke game join karein.
    </p>

    <input
        type="text"
        id="username"
        placeholder="Apna Naam Likhein"
        maxlength="20"
        autocomplete="off"
    >

    <input
        type="text"
        id="room-code"
        placeholder="Room Code (jaise: 1234)"
        maxlength="8"
        autocomplete="off"
    >

    <button id="join-button">
        Game Join Karein
    </button>

    <div id="login-message"></div>

    <div class="status">
        Real-time multiplayer powered by Socket.IO
    </div>

</div>


<!-- =========================
     LOBBY SCREEN
========================= -->

<div
    class="container hidden"
    id="lobby-screen"
>

    <h2>🎮 Game Lobby</h2>

    <div class="room-info">

        Room Code:

        <strong id="room-display">
        </strong>

    </div>

    <h3>
        Players
    </h3>

    <ul id="players-list"></ul>

    <button
        id="start-button"
        class="hidden"
    >
        Game Start Karein
    </button>

    <p id="lobby-message">
        Host ke game start karne ka wait karein...
    </p>

</div>


<!-- =========================
     QUIZ SCREEN
========================= -->

<div
    class="container hidden"
    id="quiz-screen"
>

    <h3 id="question-number">
        Question
    </h3>

    <h2 id="question-title">
    </h2>

    <div id="options-container">
    </div>

    <div id="message">
    </div>

    <hr>

    <h3>
        🏆 Live Scores
    </h3>

    <ul id="score-list">
    </ul>

</div>


<!-- =========================
     RESULT SCREEN
========================= -->

<div
    class="container hidden"
    id="result-screen"
>

    <h2>
        🏆 Game Finished!
    </h2>

    <div id="leaderboard">
    </div>

    <button onclick="location.reload()">
        New Game
    </button>

</div>


<!-- Socket.IO client -->

<script src="/socket.io/socket.io.js"></script>


<script>

    /*
     * Connect to the same server
     * from which this page was loaded.
     */

    const socket = io();


    /* =========================
       ELEMENTS
    ========================= */

    const loginScreen =
        document.getElementById(
            "login-screen"
        );

    const lobbyScreen =
        document.getElementById(
            "lobby-screen"
        );

    const quizScreen =
        document.getElementById(
            "quiz-screen"
        );

    const resultScreen =
        document.getElementById(
            "result-screen"
        );

    const loginMessage =
        document.getElementById(
            "login-message"
        );

    const message =
        document.getElementById(
            "message"
        );


    /* =========================
       BUTTONS
    ========================= */

    document
        .getElementById("join-button")
        .addEventListener(
            "click",
            joinRoom
        );


    document
        .getElementById("start-button")
        .addEventListener(
            "click",
            startGame
        );


    /* =========================
       ROOM CODE
    ========================= */

    document
        .getElementById("room-code")
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .toUpperCase()
                        .replace(
                            /[^A-Z0-9]/g,
                            ""
                        );
            }
        );


    /* =========================
       ENTER KEY
    ========================= */

    document
        .getElementById("username")
        .addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {
                    joinRoom();
                }
            }
        );


    document
        .getElementById("room-code")
        .addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {
                    joinRoom();
                }
            }
        );


    /* =========================
       JOIN ROOM
    ========================= */

    function joinRoom() {

        const username =
            document
                .getElementById(
                    "username"
                )
                .value
                .trim();


        const roomCode =
            document
                .getElementById(
                    "room-code"
                )
                .value
                .trim()
                .toUpperCase();


        if (!username || !roomCode) {

            loginMessage.innerText =
                "Naam aur room code dono bharein!";

            return;
        }


        socket.emit(
            "joinRoom",
            {
                username,
                roomCode
            }
        );
    }


    /* =========================
       JOIN SUCCESS
    ========================= */

    socket.on(
        "joinedRoom",
        data => {

            loginScreen
                .classList
                .add("hidden");


            lobbyScreen
                .classList
                .remove("hidden");


            document
                .getElementById(
                    "room-display"
                )
                .innerText =
                data.roomCode;


            updateHostUI(
                data.isHost
            );
        }
    );


    /* =========================
       PLAYER UPDATE
    ========================= */

    socket.on(
        "playersUpdate",
        data => {

            const list =
                document
                    .getElementById(
                        "players-list"
                    );


            list.innerHTML = "";


            data.players.forEach(
                player => {

                    const li =
                        document.createElement(
                            "li"
                        );


                    const hostText =
                        player.id === data.host
                            ? " 👑 Host"
                            : "";


                    li.innerText =
                        `${player.username}${hostText} — ${player.score} pts`;


                    list.appendChild(li);
                }
            );


            updateHostUI(
                data.host === socket.id
            );


            updateScoreboard(
                data.players
            );
        }
    );


    /* =========================
       HOST UI
    ========================= */

    function updateHostUI(
        isHost
    ) {

        const startButton =
            document.getElementById(
                "start-button"
            );


        const lobbyMessage =
            document.getElementById(
                "lobby-message"
            );


        if (isHost) {

            startButton
                .classList
                .remove("hidden");


            lobbyMessage.innerText =
                "Aap host hain. Game start karein.";

        } else {

            startButton
                .classList
                .add("hidden");


            lobbyMessage.innerText =
                "Host ke game start karne ka wait karein...";
        }
    }


    /* =========================
       START GAME
    ========================= */

    function startGame() {

        socket.emit(
            "startGame"
        );
    }


    /* =========================
       NEW QUESTION
    ========================= */

    socket.on(
        "newQuestion",
        data => {

            lobbyScreen
                .classList
                .add("hidden");


            quizScreen
                .classList
                .remove("hidden");


            document
                .getElementById(
                    "question-number"
                )
                .innerText =
                `Question ${data.questionNumber} / ${data.totalQuestions}`;


            document
                .getElementById(
                    "question-title"
                )
                .innerText =
                data.question;


            const optionsContainer =
                document
                    .getElementById(
                        "options-container"
                    );


            optionsContainer.innerHTML =
                "";


            message.innerText =
                "";


            data.options.forEach(
                (option, index) => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "option";


                    button.innerText =
                        `${index + 1}. ${option}`;


                    button.addEventListener(
                        "click",
                        () => {

                            submitAnswer(
                                index
                            );


                            /*
                             * Prevent multiple answers
                             */

                            document
                                .querySelectorAll(
                                    ".option"
                                )
                                .forEach(
                                    btn => {
                                        btn.disabled =
                                            true;
                                    }
                                );
                        }
                    );


                    optionsContainer
                        .appendChild(
                            button
                        );
                }
            );
        }
    );


    /* =========================
       ANSWER
    ========================= */

    function submitAnswer(
        answer
    ) {

        socket.emit(
            "submitAnswer",
            {
                answer
            }
        );
    }


    /* =========================
       ANSWER RESULT
    ========================= */

    socket.on(
        "answerResult",
        data => {

            if (data.correct) {

                message.innerText =
                    `✅ ${data.message}`;

            } else {

                message.innerText =
                    `❌ ${data.message}`;
            }
        }
    );


    /* =========================
       SCOREBOARD
    ========================= */

    function updateScoreboard(
        players
    ) {

        const list =
            document
                .getElementById(
                    "score-list"
                );


        list.innerHTML =
            "";


        const sortedPlayers =
            [...players].sort(
                (a, b) =>
                    b.score - a.score
            );


        sortedPlayers.forEach(
            player => {

                const li =
                    document.createElement(
                        "li"
                    );


                li.innerText =
                    `${player.username}: ${player.score} points`;


                list.appendChild(
                    li
                );
            }
        );
    }


    /* =========================
       GAME FINISHED
    ========================= */

    socket.on(
        "gameFinished",
        data => {

            quizScreen
                .classList
                .add("hidden");


            resultScreen
                .classList
                .remove("hidden");


            const leaderboard =
                document
                    .getElementById(
                        "leaderboard"
                    );


            leaderboard.innerHTML =
                "";


            data.leaderboard.forEach(
                (player, index) => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "leader";


                    div.innerText =
                        `${index + 1}. ${player.username} — ${player.score} points`;


                    leaderboard.appendChild(
                        div
                    );
                }
            );
        }
    );


    /* =========================
       HOST TRANSFER
    ========================= */

    socket.on(
        "becameHost",
        () => {

            updateHostUI(
                true
            );


            alert(
                "Purana host leave ho gaya. Ab aap host hain!"
            );
        }
    );


    /* =========================
       SERVER ERROR
    ========================= */

    socket.on(
        "errorMessage",
        msg => {

            loginMessage.innerText =
                msg;

            message.innerText =
                msg;
        }
    );


    /* =========================
       CONNECTION ERROR
    ========================= */

    socket.on(
        "connect_error",
        () => {

            loginMessage.innerText =
                "Server se connection nahi ho pa raha. Thodi der baad try karein.";
        }
    );

</script>

</body>

</html>
```
